  m.querySelectorAll('.ca canvas').forEach((c,i)=>prev(c,i,st.own[i],.35));m.scrollTop=sc;return}
 const PG=100,base=st.pg*PG,bi=st.pg,BM=BMS[bi],L=lvl(st.sel),C=cityFor(L);
 const cnt=[...Array(PG)].reduce((a,q,i)=>a+((base+i+1<st.lv||st.best[base+i+1])?1:0),0),ready=cnt>=PG,claimed=st.pc[st.pg],rb=Math.min(5,2+st.pg),
  panel=`<div class="crw"><div class="crt">Biome Clear Rewards</div><div class="crb"><span class="chip"><u></u>${800*(st.pg+1)}</span><span class="chip" style="background:${RC[rb]}">${RN[rb]} Box</span><span class="cnt">${cnt}/${PG}</span><button ${ready&&!claimed?'':'disabled'} onclick="claimPage()">${claimed?'Claimed':ready?'Claim':'Locked'}</button></div></div>`;
 m.innerHTML=head+`<div class="pgr banner" style="background:${BM.bn}"><button ${st.pg<=0?'disabled':''} onclick="st.pg--;menu()">&lt;</button><div><b>${bi+1}. ${BIOMES[bi].n}</b><small>Levels ${base+1}-${base+PG}, all 100 levels, boss every 5</small></div><button ${st.pg>=4?'disabled':''} onclick="st.pg++;menu()">&gt;</button></div>${panel}
 <canvas id="mapc" class="mapc"></canvas>
 <div id="bar2"><div id="info"><b>Level ${st.sel}: ${C.n}${st.sel==1?' (Tutorial)':L.boss?' (BOSS)':''}</b><small>Toughness x${L.mul.toFixed(1)}, ${L.rods} rods, ${L.regen?'repair crews':'no repairs'}, ${L.i>=5?'timed':'no timer'}</small></div><button id="go" onclick="newGame()">Battle</button></div>`;
 const mc=$('mapc');drawMap(mc,bi,base);
 const ix=Math.max(0,Math.min(PG-1,st.sel-1-base)),nd=mapNodes[ix];m.scrollTop=keep?sc:Math.max(0,(mc.offsetTop||330)+(nd?nd.y*2:0)-m.clientHeight*.5);
}
rs();menu();requestAnimationFrame(loop);
